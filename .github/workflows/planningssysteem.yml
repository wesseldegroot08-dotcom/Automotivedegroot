name: Planningssysteem testen

# Draait alleen als er iets in de map planningssysteem/ verandert.
on:
  push:
    branches: [main]
    paths: ["planningssysteem/**", ".github/workflows/planningssysteem.yml"]
  pull_request:
    paths: ["planningssysteem/**", ".github/workflows/planningssysteem.yml"]

permissions:
  contents: read

jobs:
  testen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planningssysteem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakketten installeren
        run: pip install -r requirements.txt
      - name: Codestijl
        run: ruff check app tests migrations
      - name: Tests
        run: pytest
